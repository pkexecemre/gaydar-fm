name: Build Debian package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libfreetype6-dev \
            libfontconfig1-dev ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --lib

      - name: Build release binary
        run: cargo build --release

      - name: Build .deb
        run: packaging/build-deb.sh --skip-build

      - name: Validate Debian package
        run: |
          DEB="$(ls dist/gaydar-fm_*_amd64.deb | head -n1)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E 'usr/bin/gaydar|usr/share/applications/gaydar.desktop|usr/share/gaydar/assets/fonts'
          sha256sum "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaydar-fm-deb
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
