[package]
name = "gaydar"
version = "0.1.0"
edition = "2024"
description = "GAYDAR — a very queer SoundCloud radio, native Rust + BUI"
license = "GPL-3.0-or-later"
repository = "https://github.com/pkexecemre/gaydar-fm"
homepage = "https://github.com/pkexecemre/gaydar-fm"

[dependencies]
alsa = "0.12.1"
anyhow = "1.0.104"
blenderui = "0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "7.0.0"
once_cell = "1.21.4"
png = "0.18.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
